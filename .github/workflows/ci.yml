name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      # Turbopack's persistent build cache (on by default since Next 16.3) lives in .next/cache and only
      # speeds CI up if that directory survives between runs. Keyed on the lockfile + source hash, with
      # lockfile-only and generic fallbacks so a partial cache is still reused.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

      # Speed PR-1 (audit M8): each public page's first-load JavaScript must stay under its budget
      # (scripts/perf/first-load-budget.json). The table it prints is the number to quote when a budget has to move.
      - name: First-load JS budget (public pages)
        run: node scripts/perf/first-load-js.mjs
