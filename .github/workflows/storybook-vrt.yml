name: storybook-vrt

# Visual-regression gate over the Storybook stories (F2). Builds Storybook statically, captures every
# story at 1440 + 380 with the F1 headless-Chrome harness (scripts/vrt/capture.mjs), and diffs against
# the baselines committed in scripts/vrt/__baselines__/ (scripts/vrt/diff.mjs, AA-filtered at THRESH=60).
# A story whose changed-pixel share exceeds GATE_PCT fails the job and blocks merge.
#
# BASELINES ARE COMMITTED BY A HUMAN, NEVER BY CI. They must be rendered on THIS runner's OS + Chrome
# (font anti-aliasing is platform-specific), so they cannot come from a Windows/macOS dev machine.
# Flow: the job ALWAYS captures, then compares the full baseline ∧ current SETS. Any story captured with
# no committed baseline is uploaded (only the missing PNGs) as the `vrt-baselines-to-commit` artifact and
# the job FAILS with the story names; a human commits those PNGs to scripts/vrt/__baselines__/ and pushes,
# and the job re-runs green. This works when new stories are added to an existing gate (a partial baseline
# set), not only for an empty set. A stale baseline that no story renders fails as an ORPHAN, so baselines
# cannot rot silently.
#
# A one-command task to render baselines inside this runner's container image would be tidier, but
# Docker was unavailable in the F2 authoring environment, so the artifact-download flow above is the
# supported path. See docs/f2-state.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # CI never commits baselines — a human does, in a PR.

jobs:
  vrt:
    name: Storybook visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Resolve the runner's Chrome
        id: chrome
        run: |
          CHROME="$(which google-chrome || which google-chrome-stable || which chromium-browser)"
          test -n "$CHROME" || { echo "::error::No Chrome on the runner"; exit 1; }
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Build Storybook (static)
        run: npm run build-storybook

      # Always capture + check. `vrt:stories check` compares the full baseline ∧ current SETS: a story
      # captured with no committed baseline FAILS as MISSING (never silently skipped — that was the
      # false-green hole), a baseline no story renders FAILS as ORPHAN, and it prints the three counts
      # (compared / missing / orphan). Missing PNGs are staged under scripts/vrt/__to-commit__.
      - name: Capture + check (gate on diff, missing, and orphan)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          THRESH: '60'
          # 0.05% — the measured Linux story-level noise floor is 0.000% (CI run 30205346920), so this
          # sits far above it yet catches a component-level regression. See docs/f2-state.md.
          GATE_PCT: '0.05'
        run: npm run vrt:stories check

      # Missing baselines → upload ONLY the missing PNGs. A human commits them to
      # scripts/vrt/__baselines__/ in this PR and the job re-runs green. Works for a partial set (new
      # stories added to an existing gate), not just an empty one — CI still never commits baselines.
      - name: Upload missing baselines to commit
        if: failure() && hashFiles('scripts/vrt/__to-commit__/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vrt-baselines-to-commit
          path: scripts/vrt/__to-commit__/

      # Any failure → also upload the current captures so a real diff can be eyeballed.
      - name: Upload current captures on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-current-captures
          path: scripts/vrt/__current__/
          retention-days: 7
